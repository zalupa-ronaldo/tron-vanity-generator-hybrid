name: Windows release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

jobs:
  linux-cuda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install nvidia-cuda-nvrtc-cu12==12.6.85
      - name: Install CPU OpenCL runtime for integration tests
        run: sudo apt-get update && sudo apt-get install -y pocl-opencl-icd
      - name: Build CUDA PTX and Linux executable
        run: |
          cmake -S . -B build-cuda -DTRON_ENABLE_CUDA=ON
          cmake --build build-cuda -j 4
      - name: Verify shared CUDA math and missing-driver behavior
        run: |
          ctest --test-dir build-cuda --output-on-failure
          ./build-cuda/tron_vanity_generator --list
          if ./build-cuda/tron_vanity_generator --backend cuda --gputest; then
            echo "Unexpected CUDA device on a CPU-only runner"
            exit 1
          fi

  windows-x64:
    runs-on: windows-latest
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build-time CUDA compiler (no GPU needed)
        run: python -m pip install nvidia-cuda-nvrtc-cu12==12.6.85

      - name: Build and run smoke tests
        shell: pwsh
        run: .\build.ps1 -EnableCuda

      - name: Validate bounded OpenCL launcher syntax
        shell: pwsh
        run: |
          $parseErrors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$pwd/test-opencl.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }

      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item build\tron_vanity_generator.exe release\
          Copy-Item words.example.txt release\words.txt
          Copy-Item README.md,NOTICE,LICENSE release\
          Copy-Item test-opencl.ps1,test-opencl.cmd release\
          Compress-Archive -Path release\* -DestinationPath tron-vanity-generator-windows-x64.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: tron-vanity-generator-windows-x64.zip
