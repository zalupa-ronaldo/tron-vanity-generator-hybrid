name: Windows release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

jobs:
  windows-vulkan-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install pinned Vulkan SDK
        shell: pwsh
        run: |
          choco install vulkan-sdk --version 1.4.350 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Vulkan SDK install failed: $LASTEXITCODE" }
          $env:VULKAN_SDK = 'C:\VulkanSDK\1.4.350.0'
          if (-not (Test-Path "$env:VULKAN_SDK\Bin\glslangValidator.exe")) {
            throw 'Vulkan SDK shader compiler missing'
          }
          "VULKAN_SDK=$env:VULKAN_SDK" >> $env:GITHUB_ENV
          "$env:VULKAN_SDK\Bin" >> $env:GITHUB_PATH
      - name: Compile native Vulkan address stages on Windows
        shell: pwsh
        run: |
          .\build.ps1 -EnableVulkan -SkipVulkanRuntimeTests
          # GitHub's Windows runner has no RX 9070 XT; it cannot validate the
          # GPU dispatch. Linux Mesa does runtime correctness, RX needs user A/B.
      - name: Verify optional Vulkan benchmark launcher
        shell: powershell
        run: |
          $parseErrors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$pwd/bench-vulkan.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          .\tests\vulkan_launcher_test.ps1
      - name: Package opt-in Vulkan benchmark
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path vulkan-stage-test | Out-Null
          Copy-Item build\tron_vanity_generator.exe,bench-vulkan.cmd,bench-vulkan.ps1 vulkan-stage-test\
          Copy-Item words.example.txt vulkan-stage-test\words.txt
      - name: Keep opt-in Vulkan stage-test executable
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-stage-test-windows-x64
          path: vulkan-stage-test/
          if-no-files-found: error
          retention-days: 14

  linux-cuda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install nvidia-cuda-nvrtc-cu12==12.6.85
      - name: Install CPU GPU-API runtimes for integration tests
        run: sudo apt-get update && sudo apt-get install -y pocl-opencl-icd libvulkan-dev glslang-tools mesa-vulkan-drivers vulkan-tools
      - name: Build CUDA PTX, Vulkan probe and Linux executable
        run: |
          cmake -S . -B build-cuda -DTRON_ENABLE_CUDA=ON -DTRON_ENABLE_VULKAN=ON
          cmake --build build-cuda -j 4
      - name: Verify shared CUDA math and missing-driver behavior
        run: |
          ctest --test-dir build-cuda --output-on-failure
          ./build-cuda/tron_vanity_generator --list
          if ./build-cuda/tron_vanity_generator --backend cuda --gputest; then
            echo "Unexpected CUDA device on a CPU-only runner"
            exit 1
          fi

  windows-x64:
    runs-on: windows-latest
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build-time CUDA compiler (no GPU needed)
        run: python -m pip install nvidia-cuda-nvrtc-cu12==12.6.85

      - name: Build and run smoke tests
        shell: pwsh
        run: .\build.ps1 -EnableCuda

      - name: Validate bounded OpenCL launcher syntax
        shell: pwsh
        run: |
          $parseErrors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$pwd/test-opencl.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }

      - name: Test diagnostic launcher process isolation and recovery
        shell: powershell
        run: .\tests\opencl_launcher_test.ps1

      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item build\tron_vanity_generator.exe release\
          Copy-Item words.example.txt release\words.txt
          Copy-Item README.md,NOTICE,LICENSE,tron-vanity.conf release\
          Copy-Item test-opencl.ps1,test-opencl.cmd,bench.cmd release\
          Compress-Archive -Path release\* -DestinationPath tron-vanity-generator-windows-x64.zip

      - name: Verify packaged no-argument configuration
        shell: pwsh
        run: |
          foreach ($name in @('tron_vanity_generator.exe', 'tron-vanity.conf', 'words.txt', 'bench.cmd')) {
            if (-not (Test-Path (Join-Path release $name))) { throw "Missing release file: $name" }
          }
          Push-Location release
          try {
            $output = .\tron_vanity_generator.exe devices
            if ($LASTEXITCODE -ne 0 -or -not (($output -join "`n") -match 'Config:.*tron-vanity.conf')) {
              throw "Packaged executable did not load its adjacent config: $($output -join ' ')"
            }
          } finally { Pop-Location }

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: tron-vanity-generator-windows-x64.zip
