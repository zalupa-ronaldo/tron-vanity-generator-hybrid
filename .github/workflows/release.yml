name: Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build and run smoke tests
        shell: pwsh
        run: .\build.ps1

      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item build\tron_vanity_generator.exe release\
          Copy-Item words.example.txt release\words.txt
          Copy-Item README.md,NOTICE,LICENSE release\
          Compress-Archive -Path release\* -DestinationPath tron-vanity-generator-windows-x64.zip

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: tron-vanity-generator-windows-x64.zip
