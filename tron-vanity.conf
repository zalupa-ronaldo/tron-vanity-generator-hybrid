# RX 9070 XT / gfx1201: the math/group settings measured about 105 M keys/s
# with the user's 358-word dictionary and an 8 MiB profile ring (2026-09-22).
# This 128 MiB search ring favors match capacity; its wall-rate comparison
# against 8 MiB is included in bench.cmd but not yet measured on this RX.
# Keep this file next to tron_vanity_generator.exe and put your words.txt there.
# Double-click the exe to run until Ctrl+C. Results contain private keys.
backend=opencl
strict-backend=true
seconds=0
words=words.txt
out=results
gpu-resident=true
gpu-rng=chacha12
gpu-buffer-mb=128
gpu-chunk-ms=32
gpu-group-size=64
opencl-pipeline=staged
opencl-inverse=pair
opencl-affine-batch=4
opencl-curve-batch=2
opencl-compiler=compact
opencl-opt-mask=63
# Enable only if the full A/B benchmark wins on your GPU.
opencl-async-meta-read=false
opencl-sha-ring=false
